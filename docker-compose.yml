
services:
  orders-db:
    container_name: orders_database
    image: postgres:18.6-alpine3.24
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - ./postgres:/var/lib/postgresql
      # Creates the app role (orders-ms connects with it, so RLS applies) on first init
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    environment:
      - POSTGRES_USER=${ORDERS_DB_USER}
      - POSTGRES_PASSWORD=${ORDERS_DB_PASSWORD}
      - POSTGRES_DB=${ORDERS_DB_NAME}
      - APP_DB_USER=${ORDERS_DB_APP_USER}
      - APP_DB_PASSWORD=${ORDERS_DB_APP_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  products-db:
    container_name: products_database
    image: postgres:18.6-alpine3.24
    restart: always
    ports:
      - "5433:5432"
    volumes:
      - ./postgres-products:/var/lib/postgresql
      # Creates the app role (products-ms connects with it, so RLS applies) on first init
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    environment:
      - POSTGRES_USER=${PRODUCTS_DB_USER}
      - POSTGRES_PASSWORD=${PRODUCTS_DB_PASSWORD}
      - POSTGRES_DB=${PRODUCTS_DB_NAME}
      - APP_DB_USER=${PRODUCTS_DB_APP_USER}
      - APP_DB_PASSWORD=${PRODUCTS_DB_APP_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  finance-db:
    container_name: finance_database
    image: postgres:18.6-alpine3.24
    restart: always
    ports:
      - "5434:5432"
    volumes:
      - ./postgres-finance:/var/lib/postgresql
      # Creates the app role (finance-ms connects with it, so RLS applies) on first init
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    environment:
      - POSTGRES_USER=${FINANCE_DB_USER}
      - POSTGRES_PASSWORD=${FINANCE_DB_PASSWORD}
      - POSTGRES_DB=${FINANCE_DB_NAME}
      - APP_DB_USER=${FINANCE_DB_APP_USER}
      - APP_DB_PASSWORD=${FINANCE_DB_APP_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MongoDB for auth-ms. Prisma 8 needs MongoDB >= 8.0; it runs as a single-node
  # replica set (rs0) so transactions/change streams are available. The healthcheck
  # initiates the replica set on first start and reports healthy once it is ready
  auth-db:
    container_name: auth_database
    image: mongo:8
    restart: always
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - ./mongo:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'auth-db:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  rabbitmq:
    container_name: syner_rabbitmq
    image: rabbitmq:4-management
    # Fixed hostname: RabbitMQ stores its data under mnesia/rabbit@<hostname>,
    # so a random container hostname would start from scratch on every recreate
    hostname: syner-rabbitmq
    restart: always
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI (guest / guest)
    volumes:
      - ./rabbitmq-data:/var/lib/rabbitmq
      # Declarative topology: guest user, exchanges, work queues, DLX and DLQs
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/10-definitions.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # Microservices run in development mode: src/ is bind-mounted and
  # `nest start --watch` recompiles on every change. The environment below
  # overrides each service's .env (dotenv never overwrites existing variables).

  products-ms:
    container_name: syner_products_ms
    init: true # forwards stop signals and reaps the watcher's child processes
    build: ./products-ms
    restart: unless-stopped
    # migrate deploy runs as the table owner (MIGRATE_DATABASE_URL); the service connects
    # with the app role (DATABASE_URL), subject to RLS. New organizations start empty: the
    # demo catalog is loaded by hand (SEED_ORGANIZATION_ID, see README)
    command: sh -c "pnpm prisma generate && pnpm prisma migrate deploy && exec pnpm start:dev"
    volumes:
      - ./products-ms/src:/app/src
      - ./products-ms/prisma:/app/prisma
    environment:
      - PORT=${PRODUCTS_MS_PORT}
      - DATABASE_URL=postgresql://${PRODUCTS_DB_APP_USER}:${PRODUCTS_DB_APP_PASSWORD}@products-db:5432/${PRODUCTS_DB_NAME}?schema=public
      - MIGRATE_DATABASE_URL=postgresql://${PRODUCTS_DB_USER}:${PRODUCTS_DB_PASSWORD}@products-db:5432/${PRODUCTS_DB_NAME}?schema=public
      - RABBITMQ_URL=${RABBITMQ_URL}
    depends_on:
      products-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  orders-ms:
    container_name: syner_order_ms
    init: true # forwards stop signals and reaps the watcher's child processes
    build: ./orders-ms
    restart: unless-stopped
    # migrate deploy runs as the table owner (MIGRATE_DATABASE_URL); the service connects
    # with the app role (DATABASE_URL), subject to RLS
    command: sh -c "pnpm prisma generate && pnpm prisma migrate deploy && exec pnpm start:dev"
    volumes:
      - ./orders-ms/src:/app/src
      - ./orders-ms/prisma:/app/prisma
    environment:
      - PORT=${ORDERS_MS_PORT}
      - DATABASE_URL=postgresql://${ORDERS_DB_APP_USER}:${ORDERS_DB_APP_PASSWORD}@orders-db:5432/${ORDERS_DB_NAME}?schema=public
      - MIGRATE_DATABASE_URL=postgresql://${ORDERS_DB_USER}:${ORDERS_DB_PASSWORD}@orders-db:5432/${ORDERS_DB_NAME}?schema=public
      - RABBITMQ_URL=${RABBITMQ_URL}
    depends_on:
      orders-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  auth-ms:
    container_name: syner_auth_ms
    init: true # forwards stop signals and reaps the watcher's child processes
    build: ./auth-ms
    restart: unless-stopped
    # contract emit regenerates src/prisma/contract.{json,d.ts}; db update applies the
    # contract to the database (creates the users, organizations and memberships collections,
    # their unique indexes and validators, or evolves them). --no-interactive: a destructive
    # change fails the start instead of prompting (it needs an explicit --confirm authdb)
    command: sh -c "pnpm prisma contract emit && pnpm prisma db update --no-interactive && exec pnpm start:dev"
    volumes:
      - ./auth-ms/src:/app/src
    environment:
      - PORT=${AUTH_MS_PORT}
      - DATABASE_URL=${AUTH_DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      # Platform superadmin, created on startup if no user has SUPERADMIN_EMAIL
      - SUPERADMIN_NAME=${SUPERADMIN_NAME}
      - SUPERADMIN_EMAIL=${SUPERADMIN_EMAIL}
      - SUPERADMIN_PASSWORD=${SUPERADMIN_PASSWORD}
    depends_on:
      auth-db:
        condition: service_healthy

  # Accounting, cash flow and break-even. It reads the stock (products-ms) and the open
  # purchase orders (orders-ms) over gRPC; every change to them travels as an event
  finance-ms:
    container_name: syner_finance_ms
    init: true # forwards stop signals and reaps the watcher's child processes
    build: ./finance-ms
    restart: unless-stopped
    # migrate deploy runs as the table owner (MIGRATE_DATABASE_URL); the service connects
    # with the app role (DATABASE_URL), subject to RLS
    command: sh -c "pnpm prisma generate && pnpm prisma migrate deploy && exec pnpm start:dev"
    volumes:
      - ./finance-ms/src:/app/src
      - ./finance-ms/prisma:/app/prisma
    environment:
      - PORT=${FINANCE_MS_PORT}
      - DATABASE_URL=postgresql://${FINANCE_DB_APP_USER}:${FINANCE_DB_APP_PASSWORD}@finance-db:5432/${FINANCE_DB_NAME}?schema=public
      - MIGRATE_DATABASE_URL=postgresql://${FINANCE_DB_USER}:${FINANCE_DB_PASSWORD}@finance-db:5432/${FINANCE_DB_NAME}?schema=public
      - RABBITMQ_URL=${RABBITMQ_URL}
      - PRODUCTS_MICROSERVICE_HOST=${PRODUCTS_MS_HOST}
      - PRODUCTS_MICROSERVICE_PORT=${PRODUCTS_MS_PORT}
      - ORDERS_MICROSERVICE_HOST=${ORDERS_MS_HOST}
      - ORDERS_MICROSERVICE_PORT=${ORDERS_MS_PORT}
      - BUSINESS_TIMEZONE=${BUSINESS_TIMEZONE}
    depends_on:
      finance-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # The only service published to the host: the microservices (3001, 3002, 3003, 3004)
  # are reachable only inside the Docker network
  client-gateway:
    container_name: syner_client_gateway
    init: true # forwards stop signals and reaps the watcher's child processes
    build: ./client-gateway
    restart: unless-stopped
    ports:
      - ${CLIENT_GATEWAY_PORT}:3000
    volumes:
      - ./client-gateway/src:/app/src
    environment:
      - PORT=3000
      - PRODUCTS_MICROSERVICE_HOST=${PRODUCTS_MS_HOST}
      - PRODUCTS_MICROSERVICE_PORT=${PRODUCTS_MS_PORT}
      - ORDERS_MICROSERVICE_HOST=${ORDERS_MS_HOST}
      - ORDERS_MICROSERVICE_PORT=${ORDERS_MS_PORT}
      - AUTH_MICROSERVICE_HOST=${AUTH_MS_HOST}
      - AUTH_MICROSERVICE_PORT=${AUTH_MS_PORT}
      - FINANCE_MICROSERVICE_HOST=${FINANCE_MS_HOST}
      - FINANCE_MICROSERVICE_PORT=${FINANCE_MS_PORT}
    depends_on:
      - products-ms
      - orders-ms
      - auth-ms
      - finance-ms
