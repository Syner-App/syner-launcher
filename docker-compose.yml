
services:
  orders-db:
    container_name: orders_database
    image: postgres:18.6-alpine3.24
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - ./postgres:/var/lib/postgresql
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=ordersdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ordersdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  products-db:
    container_name: products_database
    image: postgres:18.6-alpine3.24
    restart: always
    ports:
      - "5433:5432"
    volumes:
      - ./postgres-products:/var/lib/postgresql
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=productsdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d productsdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MongoDB for auth-ms. Prisma 8 needs MongoDB >= 8.0; it runs as a single-node
  # replica set (rs0) so transactions/change streams are available. The healthcheck
  # initiates the replica set on first start and reports healthy once it is ready
  auth-db:
    container_name: auth_database
    image: mongo:8
    restart: always
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - ./mongo:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'auth-db:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  rabbitmq:
    container_name: syner_rabbitmq
    image: rabbitmq:4-management
    # Fixed hostname: RabbitMQ stores its data under mnesia/rabbit@<hostname>,
    # so a random container hostname would start from scratch on every recreate
    hostname: syner-rabbitmq
    restart: always
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI (guest / guest)
    volumes:
      - ./rabbitmq-data:/var/lib/rabbitmq
      # Declarative topology: guest user, exchanges, work queues, DLX and DLQs
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/10-definitions.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # Microservices run in development mode: src/ is bind-mounted and
  # `nest start --watch` recompiles on every change. The environment below
  # overrides each service's .env (dotenv never overwrites existing variables).

  products-ms:
    container_name: syner_products_ms
    init: true # forwards stop signals and reaps the watcher's child processes
    build: ./products-ms
    restart: unless-stopped
    # The seed upserts by codigo_sku, so it is safe to run on every start
    command: sh -c "pnpm prisma generate && pnpm prisma migrate deploy && pnpm prisma db seed && exec pnpm start:dev"
    volumes:
      - ./products-ms/src:/app/src
      - ./products-ms/prisma:/app/prisma
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:123456@products-db:5432/productsdb?schema=public
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      products-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  orders-ms:
    container_name: syner_order_ms
    init: true # forwards stop signals and reaps the watcher's child processes
    build: ./orders-ms
    restart: unless-stopped
    command: sh -c "pnpm prisma generate && pnpm prisma migrate deploy && exec pnpm start:dev"
    volumes:
      - ./orders-ms/src:/app/src
      - ./orders-ms/prisma:/app/prisma
    environment:
      - PORT=3002
      - DATABASE_URL=postgresql://postgres:123456@orders-db:5432/ordersdb?schema=public
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      orders-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  auth-ms:
    container_name: syner_auth_ms
    init: true # forwards stop signals and reaps the watcher's child processes
    build: ./auth-ms
    restart: unless-stopped
    # contract emit regenerates src/prisma/contract.{json,d.ts}; db init creates the
    # users collection and its unique email index (idempotent, safe on every start)
    command: sh -c "pnpm prisma contract emit && pnpm prisma db init && exec pnpm start:dev"
    volumes:
      - ./auth-ms/src:/app/src
    environment:
      - PORT=3003
      - DATABASE_URL=mongodb://auth-db:27017/authdb?replicaSet=rs0&directConnection=true
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      auth-db:
        condition: service_healthy

  # The only service published to the host: the microservices (3001, 3002, 3003)
  # are reachable only inside the Docker network
  client-gateway:
    container_name: syner_client_gateway
    init: true # forwards stop signals and reaps the watcher's child processes
    build: ./client-gateway
    restart: unless-stopped
    ports:
      - ${CLIENT_GATEWAY_PORT}:3000
    volumes:
      - ./client-gateway/src:/app/src
    environment:
      - PORT=3000
      - PRODUCTS_MICROSERVICE_HOST=products-ms
      - PRODUCTS_MICROSERVICE_PORT=3001
      - ORDERS_MICROSERVICE_HOST=orders-ms
      - ORDERS_MICROSERVICE_PORT=3002
      - AUTH_MICROSERVICE_HOST=auth-ms
      - AUTH_MICROSERVICE_PORT=3003
    depends_on:
      - products-ms
      - orders-ms
      - auth-ms
