# Reverse proxy of the production stack (profile `https`): the only entry from outside.
# The certificate is the `syner` lineage of certbot (issued for the VM's public IP by
# init-cert.sh, renewed by the certbot service). Upstreams are resolved per request
# through Docker's DNS, so nginx starts even if syner-app or the gateway are not up yet

resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# HTTP: ACME challenges for the renewals, everything else goes to HTTPS
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  http2 on;
  server_name _;

  ssl_certificate     /etc/letsencrypt/live/syner/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/syner/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;

  add_header Strict-Transport-Security "max-age=31536000" always;

  client_max_body_size 10m;

  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # Socket.IO of the gateway (namespace /notifications): same origin as the app, so
  # NEXT_PUBLIC_GATEWAY_WS_URL is https://<public IP>
  location /socket.io/ {
    set $gateway http://client-gateway:3000;
    proxy_pass $gateway;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # Swagger of the gateway (UI at /api/docs, document at /api/docs-json). The rest of
  # /api/* belongs to the Next.js route handlers (BFF)
  location /api/docs {
    set $gateway http://client-gateway:3000;
    proxy_pass $gateway;
  }

  location / {
    set $app http://syner-app:3001;
    proxy_pass $app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
