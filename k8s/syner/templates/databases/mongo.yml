{{- if .Values.databases.inCluster }}
# Headless: auth-db resolves straight to the pod IP and auth-db-0.auth-db exists as a
# stable name. publishNotReadyAddresses: the replica set is initiated by the readiness
# probe itself, and Mongo checks that the member host reaches this node, so the name
# must resolve before the pod is ready (a ClusterIP only routes to ready pods)
apiVersion: v1
kind: Service
metadata:
  labels:
    app: auth-db
  name: auth-db
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
  - name: mongo
    port: 27017
    targetPort: 27017
  selector:
    app: auth-db
---
# MongoDB for auth-ms. Prisma needs MongoDB >= 8.0 running as a replica set (rs0) for
# transactions; single node, as in compose
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: auth-db
  name: auth-db
spec:
  serviceName: auth-db
  replicas: 1
  selector:
    matchLabels:
      app: auth-db
  template:
    metadata:
      labels:
        app: auth-db
    spec:
      containers:
      - image: {{ .Values.databases.mongo.image }}
        name: mongo
        args: ["--replSet", "rs0", "--bind_ip_all"]
        ports:
        - name: mongo
          containerPort: 27017
        # Same check as the compose healthcheck: initiates the replica set on first start
        # and reports ready once it is up. The member host is the pod's stable DNS name
        # (headless Service); clients keep using auth-db:27017 with directConnection
        readinessProbe:
          exec:
            command:
            - mongosh
            - --quiet
            - --eval
            - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'auth-db-0.auth-db:27017' }] }).ok }"
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 10
        volumeMounts:
        - name: data
          mountPath: /data/db
        resources: {}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: {{ .Values.databases.mongo.storage }}
{{- end }}
