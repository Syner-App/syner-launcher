apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: rabbitmq
  name: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
      annotations:
        # Restarts the broker when the definitions change on helm upgrade
        checksum/definitions: {{ include (print $.Template.BasePath "/rabbitmq/configmap.yml") . | sha256sum }}
    spec:
      containers:
      - image: rabbitmq:4-management
        name: rabbitmq
        ports:
        - name: amqp
          containerPort: 5672
        - name: management
          containerPort: 15672
        readinessProbe:
          exec:
            command: ["rabbitmq-diagnostics", "-q", "ping"]
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 10
        volumeMounts:
        - name: definitions
          mountPath: /etc/rabbitmq/conf.d/10-definitions.conf
          subPath: 10-definitions.conf
        - name: definitions
          mountPath: /etc/rabbitmq/definitions.json
          subPath: definitions.json
        resources: {}
      volumes:
      - name: definitions
        configMap:
          name: rabbitmq-definitions
