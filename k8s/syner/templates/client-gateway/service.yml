# LoadBalancer: Docker Desktop publishes it on localhost:3000, the URL the browser bundle
# of syner-app opens the Socket.IO connection to (NEXT_PUBLIC_GATEWAY_WS_URL)
apiVersion: v1
kind: Service
metadata:
  creationTimestamp: null
  labels:
    app: client-gateway
  name: client-gateway
spec:
  ports:
  - name: "3000"
    port: 3000
    protocol: TCP
    targetPort: 3000
  selector:
    app: client-gateway
  type: LoadBalancer
status:
  loadBalancer: {}
