apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    app: finance-ms
  name: finance-ms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finance-ms
  strategy: {}
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: finance-ms
    spec:
      containers:
      - image: spadilla117/syner-finance-ms
        name: syner-finance-ms
        env:
        - name: PORT
          value: "3004"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: finance-ms
              key: DATABASE_URL
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: finance-ms
              key: RABBITMQ_URL
        - name: PRODUCTS_MICROSERVICE_HOST
          value: "products-ms"
        - name: PRODUCTS_MICROSERVICE_PORT
          value: "3001"
        - name: ORDERS_MICROSERVICE_HOST
          value: "orders-ms"
        - name: ORDERS_MICROSERVICE_PORT
          value: "3002"
        - name: BUSINESS_TIMEZONE
          value: "America/Bogota"
        ports:
        - name: grpc
          containerPort: 3004
        # TCP only: it does not touch the database, so a pending migration never
        # blocks the rollout (or helm --wait)
        readinessProbe:
          tcpSocket:
            port: grpc
          initialDelaySeconds: 5
          periodSeconds: 10
        resources: {}
status: {}
