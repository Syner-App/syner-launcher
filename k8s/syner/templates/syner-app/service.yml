# LoadBalancer: Docker Desktop publishes it on localhost:3001, the origin the gateway
# allows in CORS_ORIGINS (needed by the Socket.IO handshake)
apiVersion: v1
kind: Service
metadata:
  creationTimestamp: null
  labels:
    app: syner-app
  name: syner-app
spec:
  ports:
  - name: "3001"
    port: 3001
    protocol: TCP
    targetPort: 3001
  selector:
    app: syner-app
  type: LoadBalancer
status:
  loadBalancer: {}
