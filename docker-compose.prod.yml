
services:
  orders-db:
    container_name: orders_database
    image: postgres:18.6-alpine3.24
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./postgres:/var/lib/postgresql
      # Creates the app role (orders-ms connects with it, so RLS applies) on first init
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    environment:
      - POSTGRES_USER=${ORDERS_DB_USER}
      - POSTGRES_PASSWORD=${ORDERS_DB_PASSWORD}
      - POSTGRES_DB=${ORDERS_DB_NAME}
      - APP_DB_USER=${ORDERS_DB_APP_USER}
      - APP_DB_PASSWORD=${ORDERS_DB_APP_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  products-db:
    container_name: products_database
    image: postgres:18.6-alpine3.24
    restart: always
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ./postgres-products:/var/lib/postgresql
      # Creates the app role (products-ms connects with it, so RLS applies) on first init
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    environment:
      - POSTGRES_USER=${PRODUCTS_DB_USER}
      - POSTGRES_PASSWORD=${PRODUCTS_DB_PASSWORD}
      - POSTGRES_DB=${PRODUCTS_DB_NAME}
      - APP_DB_USER=${PRODUCTS_DB_APP_USER}
      - APP_DB_PASSWORD=${PRODUCTS_DB_APP_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  finance-db:
    container_name: finance_database
    image: postgres:18.6-alpine3.24
    restart: always
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - ./postgres-finance:/var/lib/postgresql
      # Creates the app role (finance-ms connects with it, so RLS applies) on first init
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    environment:
      - POSTGRES_USER=${FINANCE_DB_USER}
      - POSTGRES_PASSWORD=${FINANCE_DB_PASSWORD}
      - POSTGRES_DB=${FINANCE_DB_NAME}
      - APP_DB_USER=${FINANCE_DB_APP_USER}
      - APP_DB_PASSWORD=${FINANCE_DB_APP_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MongoDB for auth-ms. Prisma 8 needs MongoDB >= 8.0; it runs as a single-node
  # replica set (rs0) so transactions/change streams are available. The healthcheck
  # initiates the replica set on first start and reports healthy once it is ready
  auth-db:
    container_name: auth_database
    image: mongo:8
    restart: always
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - ./mongo:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'auth-db:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  rabbitmq:
    container_name: syner_rabbitmq
    image: rabbitmq:4-management
    # Fixed hostname: RabbitMQ stores its data under mnesia/rabbit@<hostname>,
    # so a random container hostname would start from scratch on every recreate
    hostname: syner-rabbitmq
    restart: always
    ports:
      - "127.0.0.1:5672:5672"   # AMQP
      - "127.0.0.1:15672:15672" # Management UI (guest / guest)
    volumes:
      - ./rabbitmq-data:/var/lib/rabbitmq
      # Declarative topology: guest user, exchanges, work queues, DLX and DLQs
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/10-definitions.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # Microservices run from their production images (Dockerfile.prod): compiled
  # dist/ plus production dependencies, no bind mounts and no watcher. Database
  # changes run first as one-off jobs (*-migrate, the `migrate` target of the same
  # Dockerfile.prod, which still has the Prisma CLI); each service starts only
  # after its job exits successfully. The environment below overrides each
  # service's .env (dotenv never overwrites existing variables).

  products-migrate:
    container_name: syner_products_migrate
    image: spadilla117/syner-products-ms-migrate
    pull_policy: always # pulls the CI image from Docker Hub
    restart: "no"
    # migrate deploy as the table owner. New organizations start empty (no seed)
    environment:
      - MIGRATE_DATABASE_URL=postgresql://${PRODUCTS_DB_USER}:${PRODUCTS_DB_PASSWORD}@products-db:5432/${PRODUCTS_DB_NAME}?schema=public
    depends_on:
      products-db:
        condition: service_healthy

  products-ms:
    container_name: syner_products_ms
    init: true # forwards stop signals to the Node process
    image: spadilla117/syner-products-ms
    pull_policy: always # pulls the CI image from Docker Hub
    restart: unless-stopped
    environment:
      - PORT=${PRODUCTS_MS_PORT}
      # App role: not a superuser, so the RLS policies apply
      - DATABASE_URL=postgresql://${PRODUCTS_DB_APP_USER}:${PRODUCTS_DB_APP_PASSWORD}@products-db:5432/${PRODUCTS_DB_NAME}?schema=public
      - RABBITMQ_URL=${RABBITMQ_URL}
    depends_on:
      products-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  orders-migrate:
    container_name: syner_orders_migrate
    image: spadilla117/syner-orders-ms-migrate
    pull_policy: always # pulls the CI image from Docker Hub
    restart: "no"
    # migrate deploy as the table owner
    environment:
      - MIGRATE_DATABASE_URL=postgresql://${ORDERS_DB_USER}:${ORDERS_DB_PASSWORD}@orders-db:5432/${ORDERS_DB_NAME}?schema=public
    depends_on:
      orders-db:
        condition: service_healthy

  orders-ms:
    container_name: syner_order_ms
    init: true # forwards stop signals to the Node process
    image: spadilla117/syner-orders-ms
    pull_policy: always # pulls the CI image from Docker Hub
    restart: unless-stopped
    environment:
      - PORT=${ORDERS_MS_PORT}
      # App role: not a superuser, so the RLS policies apply
      - DATABASE_URL=postgresql://${ORDERS_DB_APP_USER}:${ORDERS_DB_APP_PASSWORD}@orders-db:5432/${ORDERS_DB_NAME}?schema=public
      - RABBITMQ_URL=${RABBITMQ_URL}
    depends_on:
      orders-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  # db update applies the committed Prisma contract to the database (creates the users,
  # organizations and memberships collections, their unique indexes and validators, or
  # evolves them).
  # --no-interactive: a destructive change fails the job instead of prompting
  # (it needs an explicit --confirm authdb)
  auth-migrate:
    container_name: syner_auth_migrate
    image: spadilla117/syner-auth-ms-migrate
    pull_policy: always # pulls the CI image from Docker Hub
    restart: "no"
    environment:
      - DATABASE_URL=${AUTH_DATABASE_URL}
    depends_on:
      auth-db:
        condition: service_healthy

  auth-ms:
    container_name: syner_auth_ms
    init: true # forwards stop signals to the Node process
    image: spadilla117/syner-auth-ms
    pull_policy: always # pulls the CI image from Docker Hub
    restart: unless-stopped
    environment:
      - PORT=${AUTH_MS_PORT}
      - DATABASE_URL=${AUTH_DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      # Platform superadmin, created on startup if no user has SUPERADMIN_EMAIL
      - SUPERADMIN_NAME=${SUPERADMIN_NAME}
      - SUPERADMIN_EMAIL=${SUPERADMIN_EMAIL}
      - SUPERADMIN_PASSWORD=${SUPERADMIN_PASSWORD}
    depends_on:
      auth-migrate:
        condition: service_completed_successfully

  finance-migrate:
    container_name: syner_finance_migrate
    image: spadilla117/syner-finance-ms-migrate
    restart: "no"
    pull_policy: always # pulls the CI image from Docker Hub
    # migrate deploy as the table owner
    environment:
      - MIGRATE_DATABASE_URL=postgresql://${FINANCE_DB_USER}:${FINANCE_DB_PASSWORD}@finance-db:5432/${FINANCE_DB_NAME}?schema=public
    depends_on:
      finance-db:
        condition: service_healthy

  # Accounting, cash flow and break-even. It reads the stock (products-ms) and the open
  # purchase orders (orders-ms) over gRPC; every change to them travels as an event
  finance-ms:
    container_name: syner_finance_ms
    init: true # forwards stop signals to the Node process
    image: spadilla117/syner-finance-ms
    pull_policy: always # pulls the CI image from Docker Hub
    restart: unless-stopped
    environment:
      - PORT=${FINANCE_MS_PORT}
      # App role: not a superuser, so the RLS policies apply
      - DATABASE_URL=postgresql://${FINANCE_DB_APP_USER}:${FINANCE_DB_APP_PASSWORD}@finance-db:5432/${FINANCE_DB_NAME}?schema=public
      - RABBITMQ_URL=${RABBITMQ_URL}
      - PRODUCTS_MICROSERVICE_HOST=${PRODUCTS_MS_HOST}
      - PRODUCTS_MICROSERVICE_PORT=${PRODUCTS_MS_PORT}
      - ORDERS_MICROSERVICE_HOST=${ORDERS_MS_HOST}
      - ORDERS_MICROSERVICE_PORT=${ORDERS_MS_PORT}
      - BUSINESS_TIMEZONE=${BUSINESS_TIMEZONE}
    depends_on:
      finance-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  # Published to the host's loopback along with syner-app (and the databases): from outside
  # the only entry is nginx (profile `https`). The microservices (3001, 3002, 3003, 3004)
  # are reachable only inside the Docker network
  client-gateway:
    container_name: syner_client_gateway
    init: true # forwards stop signals to the Node process
    image: spadilla117/syner-client-gateway
    pull_policy: always # pulls the CI image from Docker Hub
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CLIENT_GATEWAY_PORT}:3000"
    environment:
      - PORT=3000
      - PRODUCTS_MICROSERVICE_HOST=${PRODUCTS_MS_HOST}
      - PRODUCTS_MICROSERVICE_PORT=${PRODUCTS_MS_PORT}
      - ORDERS_MICROSERVICE_HOST=${ORDERS_MS_HOST}
      - ORDERS_MICROSERVICE_PORT=${ORDERS_MS_PORT}
      - AUTH_MICROSERVICE_HOST=${AUTH_MS_HOST}
      - AUTH_MICROSERVICE_PORT=${AUTH_MS_PORT}
      - FINANCE_MICROSERVICE_HOST=${FINANCE_MS_HOST}
      - FINANCE_MICROSERVICE_PORT=${FINANCE_MS_PORT}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - CORS_ORIGINS=${CLIENT_GATEWAY_CORS_ORIGINS}
    depends_on:
      products-ms:
        condition: service_started
      orders-ms:
        condition: service_started
      auth-ms:
        condition: service_started
      finance-ms:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  # Next.js frontend from its standalone production build. NEXT_PUBLIC_GATEWAY_WS_URL is
  # inlined into the browser bundle, so it goes in as a build arg; GATEWAY_URL is read
  # at runtime by the route handlers (BFF) and points at the gateway inside the network
  syner-app:
    container_name: syner_app
    init: true # forwards stop signals to the Node process
    image: spadilla117/syner-app
    pull_policy: always # pulls the CI image from Docker Hub
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SYNER_APP_PORT}:3001"
    environment:
      - GATEWAY_URL=http://client-gateway:3000/api
    depends_on:
      client-gateway:
        condition: service_started

  # HTTPS on a VPS (profile `https`, enabled with COMPOSE_PROFILES=https in .env).
  # nginx terminates TLS on 443 with the Let's Encrypt certificate of the public IP
  # (init-cert.sh issues the first one) and proxies to syner-app and the gateway. It
  # reloads every 6h to pick up the renewed certificate
  nginx:
    container_name: syner_nginx
    image: nginx:1.28-alpine
    profiles: [https]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    command: ["/bin/sh", "-c", "while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec nginx -g 'daemon off;'"]
    depends_on:
      syner-app:
        condition: service_started
      client-gateway:
        condition: service_started

  # Renews the certificate (short-lived, ~6 days) through the webroot nginx serves on 80.
  # It checks every 12h; certbot only renews when the certificate is due (ARI)
  certbot:
    container_name: syner_certbot
    image: certbot/certbot:v5.8.0
    profiles: [https]
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"]
