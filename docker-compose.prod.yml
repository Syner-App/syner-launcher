
services:
  orders-db:
    container_name: orders_database
    image: postgres:18.6-alpine3.24
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - ./postgres:/var/lib/postgresql
    environment:
      - POSTGRES_USER=${ORDERS_DB_USER}
      - POSTGRES_PASSWORD=${ORDERS_DB_PASSWORD}
      - POSTGRES_DB=${ORDERS_DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  products-db:
    container_name: products_database
    image: postgres:18.6-alpine3.24
    restart: always
    ports:
      - "5433:5432"
    volumes:
      - ./postgres-products:/var/lib/postgresql
    environment:
      - POSTGRES_USER=${PRODUCTS_DB_USER}
      - POSTGRES_PASSWORD=${PRODUCTS_DB_PASSWORD}
      - POSTGRES_DB=${PRODUCTS_DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MongoDB for auth-ms. Prisma 8 needs MongoDB >= 8.0; it runs as a single-node
  # replica set (rs0) so transactions/change streams are available. The healthcheck
  # initiates the replica set on first start and reports healthy once it is ready
  auth-db:
    container_name: auth_database
    image: mongo:8
    restart: always
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - ./mongo:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'auth-db:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  rabbitmq:
    container_name: syner_rabbitmq
    image: rabbitmq:4-management
    # Fixed hostname: RabbitMQ stores its data under mnesia/rabbit@<hostname>,
    # so a random container hostname would start from scratch on every recreate
    hostname: syner-rabbitmq
    restart: always
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI (guest / guest)
    volumes:
      - ./rabbitmq-data:/var/lib/rabbitmq
      # Declarative topology: guest user, exchanges, work queues, DLX and DLQs
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/10-definitions.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # Microservices run from their production images (Dockerfile.prod): compiled
  # dist/ plus production dependencies, no bind mounts and no watcher. Database
  # changes run first as one-off jobs (*-migrate, the `migrate` target of the same
  # Dockerfile.prod, which still has the Prisma CLI); each service starts only
  # after its job exits successfully. The environment below overrides each
  # service's .env (dotenv never overwrites existing variables).

  products-migrate:
    container_name: syner_products_migrate
    build:
      context: ./products-ms
      dockerfile: Dockerfile.prod
      target: migrate
    image: products-ms-migrate
    restart: "no"
    # migrate deploy + seed (upserts by codigo_sku, safe to run on every start)
    environment:
      - DATABASE_URL=postgresql://${PRODUCTS_DB_USER}:${PRODUCTS_DB_PASSWORD}@products-db:5432/${PRODUCTS_DB_NAME}?schema=public
    depends_on:
      products-db:
        condition: service_healthy

  products-ms:
    container_name: syner_products_ms
    init: true # forwards stop signals to the Node process
    build:
      context: ./products-ms
      dockerfile: Dockerfile.prod
    image: products-ms
    restart: unless-stopped
    environment:
      - PORT=${PRODUCTS_MS_PORT}
      - DATABASE_URL=postgresql://${PRODUCTS_DB_USER}:${PRODUCTS_DB_PASSWORD}@products-db:5432/${PRODUCTS_DB_NAME}?schema=public
      - RABBITMQ_URL=${RABBITMQ_URL}
    depends_on:
      products-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  orders-migrate:
    container_name: syner_orders_migrate
    build:
      context: ./orders-ms
      dockerfile: Dockerfile.prod
      target: migrate
    image: orders-ms-migrate
    restart: "no"
    environment:
      - DATABASE_URL=postgresql://${ORDERS_DB_USER}:${ORDERS_DB_PASSWORD}@orders-db:5432/${ORDERS_DB_NAME}?schema=public
    depends_on:
      orders-db:
        condition: service_healthy

  orders-ms:
    container_name: syner_order_ms
    init: true # forwards stop signals to the Node process
    build:
      context: ./orders-ms
      dockerfile: Dockerfile.prod
    image: orders-ms
    restart: unless-stopped
    environment:
      - PORT=${ORDERS_MS_PORT}
      - DATABASE_URL=postgresql://${ORDERS_DB_USER}:${ORDERS_DB_PASSWORD}@orders-db:5432/${ORDERS_DB_NAME}?schema=public
      - RABBITMQ_URL=${RABBITMQ_URL}
    depends_on:
      orders-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  # db update applies the committed Prisma contract to the database (creates the
  # users collection, its unique email index and validator, or evolves them).
  # --no-interactive: a destructive change fails the job instead of prompting
  # (it needs an explicit --confirm authdb)
  auth-migrate:
    container_name: syner_auth_migrate
    build:
      context: ./auth-ms
      dockerfile: Dockerfile.prod
      target: migrate
    image: auth-ms-migrate
    restart: "no"
    environment:
      - DATABASE_URL=${AUTH_DATABASE_URL}
    depends_on:
      auth-db:
        condition: service_healthy

  auth-ms:
    container_name: syner_auth_ms
    init: true # forwards stop signals to the Node process
    build:
      context: ./auth-ms
      dockerfile: Dockerfile.prod
    image: auth-ms
    restart: unless-stopped
    environment:
      - PORT=${AUTH_MS_PORT}
      - DATABASE_URL=${AUTH_DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      # Initial owner, created on startup if no user has OWNER_EMAIL
      - OWNER_NAME=${OWNER_NAME}
      - OWNER_EMAIL=${OWNER_EMAIL}
      - OWNER_PASSWORD=${OWNER_PASSWORD}
    depends_on:
      auth-migrate:
        condition: service_completed_successfully

  # The only service published to the host: the microservices (3001, 3002, 3003)
  # are reachable only inside the Docker network
  client-gateway:
    container_name: syner_client_gateway
    init: true # forwards stop signals to the Node process
    build:
      context: ./client-gateway
      dockerfile: Dockerfile.prod
    image: client-gateway
    restart: unless-stopped
    ports:
      - ${CLIENT_GATEWAY_PORT}:3000
    environment:
      - PORT=3000
      - PRODUCTS_MICROSERVICE_HOST=${PRODUCTS_MS_HOST}
      - PRODUCTS_MICROSERVICE_PORT=${PRODUCTS_MS_PORT}
      - ORDERS_MICROSERVICE_HOST=${ORDERS_MS_HOST}
      - ORDERS_MICROSERVICE_PORT=${ORDERS_MS_PORT}
      - AUTH_MICROSERVICE_HOST=${AUTH_MS_HOST}
      - AUTH_MICROSERVICE_PORT=${AUTH_MS_PORT}
    depends_on:
      - products-ms
      - orders-ms
      - auth-ms
